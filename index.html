<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>iPhone</title>
<link rel="stylesheet" href="styles.css?v=61">
<link rel="stylesheet" href="editor.css?v=61">
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen">
    <div class="canvas" id="canvas">

      <!-- 壁纸 -->
      <div class="wall" id="wall"></div>

      <!-- 锁屏 -->
      <section class="layer lock" id="lockL">
        <div class="lockTop">
          <div class="lockDate" id="lockDate"></div>
          <div class="lockClock" id="lockClock">9:41</div>
        </div>
        <div class="lockBottom">
          <div class="noticeList" id="noticeList"></div>
          <div class="unlockHint" id="unlockHint">
            <div class="swipeBar"></div>
            <span>Slide up to unlock</span>
          </div>
        </div>
      </section>

      <!-- PIN -->
      <section class="layer pin" id="pinL">
        <div class="pinTitle" id="pinTitle">Enter Passcode</div>
        <div class="pinDots" id="pinDots"></div>
        <div class="keypad" id="keypad"></div>
        <button class="pinCancel" id="pinCancel">Cancel</button>
      </section>

      <!-- 主屏 -->
      <section class="layer home hidden" id="homeL">
        <div class="pagesTrack" id="pagesTrack">
          <div class="page" id="page1">
            <div class="widget" id="homeWidget"></div>
            <div class="homeGrid" id="homeGrid"></div>
            <div class="widgetRow">
              <div class="miniWidget" id="wWeather"></div>
              <div class="miniWidget" id="wMusic"></div>
            </div>
          </div>
          <div class="page" id="page2">
            <div class="homeGrid" id="page2Grid"></div>
            <div class="p2Widget" id="p2Photos"></div>
            <div class="p2Widget" id="p2Today"></div>
          </div>
        </div>
        <div class="dock" id="dock"></div>
        <div class="pageDots" id="pageDots">
          <i class="on" data-page="0"></i><i data-page="1"></i>
        </div>
      </section>

      <!-- App 容器 -->
      <section class="layer appLayer" id="appL"></section>

      <!-- 来电 -->
      <section class="callScreen" id="callScreen">
        <div class="callBg"></div>
        <div class="callInfo">
          <div class="callTag" id="callTag">来电</div>
          <div class="callName" id="callName"></div>
          <div class="callSub" id="callSub">正在呼叫…</div>
          <img class="callAvatar" id="callAvatar" alt="">
        </div>
        <div class="callActions" id="callActions">
          <button class="callBtn decline" id="btnDecline"><span>✕</span><em>拒绝</em></button>
          <button class="callBtn accept" id="btnAccept"><span>✆</span><em>接听</em></button>
        </div>
        <div class="callTimer" id="callTimer"></div>
      </section>

      <!-- 图片全屏 -->
      <div class="viewer" id="viewer">
        <img id="viewerImg" alt="">
        <div class="viewerCap" id="viewerCap"></div>
        <button class="viewerClose" id="viewerClose">✕</button>
      </div>

      <!-- 状态栏 / 灵动岛 / Home 条 -->
      <div class="statusbar light" id="statusbar">
        <span class="sbLeft">
          <svg class="sbBars" viewBox="0 0 18 12" width="15" height="10"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0.5" width="3" height="11.5" rx="1"/></svg>
          <span class="sb3g">3G</span>
        </span>
        <span class="sbTime" id="sbTime">9:41 AM</span>
        <span class="sbRight"><span class="battery"><i></i></span></span>
      </div>
      <div class="island" id="island">
        <span class="islandDot"></span>
        <span class="islandText" id="islandText"></span>
      </div>
      <button class="homebar" id="homebar" aria-label="Home"></button>
      <div class="toast" id="toast"></div>
      </div>

    </div>
  </div>
</div>

<script src="data.js?v=61"></script>
<script src="cloud-config.js?v=61"></script>
<script src="cloud.js?v=61"></script>
<script src="icons.js?v=61"></script>
<!-- custom.js loads saved content + uploaded media, then boots app.js -->
<script src="custom.js?v=61"></script>
<script src="editor.js?v=61"></script>
</body>
</html>
